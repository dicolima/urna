services:
  - type: web
    name: urna-didatica
    runtime: node
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: RESET_PASSWORD
        sync: false
